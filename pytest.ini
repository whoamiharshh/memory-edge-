[pytest]
testpaths = tests
pythonpath = .
addopts = -q
# Two known, harmless third-party notices (everything else still shows):
#  - Starlette's TestClient asks for the newer "httpx2" package (test tooling only, the app does not use it)
#  - in-memory Qdrant (tests only) says payload indexes have no effect; the real server tests use them
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:Payload indexes have no effect in the local Qdrant
