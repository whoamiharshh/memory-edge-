# Runs the test suite on Linux, macOS and Windows whenever the repository is pushed to GitHub.
# STATUS: written 28 Sep 2026 and NOT yet run on GitHub (the project is not on GitHub yet). Simulated locally the same
# day on a clean copy of the tracked files (no data, no models, no runtime): 239 passed, 0 failed, 58 skipped - most
# skips were the CWRU tests, hence the CWRU step below. Tests that need other data sets (SCANIA, UCI) or the optional
# LLM skip themselves; the Qdrant Server binary for the runner's OS is downloaded by tools/qdrant_local.py.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python 3.12 environment
        run: uv venv .venv --python 3.12
      - name: Install (without the optional local LLM and the browser-test tool)
        shell: bash
        run: |
          grep -v -E '^(llama-cpp-python|playwright)' requirements.txt > ci-requirements.txt
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          VIRTUAL_ENV=.venv uv pip install -r ci-requirements.txt
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: Qdrant Server binary for this OS
        shell: bash
        run: $PY -m tools.qdrant_local download
      - name: Certificates for the HTTPS / mutual-TLS tests
        shell: bash
        run: $PY tools/make_certs.py
      - name: Cache the public CWRU recordings (downloaded, never committed)
        uses: actions/cache@v4
        with:
          path: data/raw/cwru
          key: cwru-12k-de-40-files-v1
      - name: Real CWRU data + feature cache (most integration tests need it; they skip if this step fails)
        continue-on-error: true
        shell: bash
        run: |
          $PY -c "from data.fetch_data import CWRU, CWRU_BASE, ROOT, fetch; [fetch(CWRU_BASE.format(f), ROOT / 'cwru' / f'{f}.mat') for f in CWRU]"
          $PY -c "from data.splits import build_dataset; build_dataset()"
      - name: Tests
        shell: bash
        run: $PY -m pytest
